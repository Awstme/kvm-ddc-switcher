[package]
name = "kvm-ddc-gui"
version = "0.1.0"
description = "Tray GUI for kvm-ddc-switcher (macOS daemon manager)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
